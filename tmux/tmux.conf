set -a terminal-features "screen-256color:RGB"
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position bottom
set -g prefix F12

set -g status-style "bg=#1e1e1e,fg=#808080"

set -g window-status-format " #I:#W "
set -g window-status-style "bg=#1e1e1e,fg=#808080"

# Active window — Neovim-ish blue
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#3b3b3b,fg=#81a1c1,bold"

set -g status-left-style "bg=#1e1e1e,fg=#81a1c1,bold"
set -g status-right-style "bg=#1e1e1e,fg=#808080"

set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#81a1c1"

set -g message-style "bg=#303030,fg=#ffffff"
set -g message-command-style "bg=#303030,fg=#ffffff"

set -g mode-style "bg=#3b3b3b,fg=#ffffff"

set -g clock-mode-colour "#81a1c1"

bind r source-file "~/.config/tmux/tmux.conf"
bind g neww -n "lazygit" lazygit

╭─   ~/dev/dotfiles/tmux on   main ⇡1 
